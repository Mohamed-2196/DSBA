<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Modules, lessons, files, the newsletter and the forum for DSBA students at BIBF." />
    <meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07122B" media="(prefers-color-scheme: dark)" />
    <title>DSBA Hub</title>
    <script>
      // Apply the saved theme before first paint (v1 key: localStorage.theme = 'light' | 'dark').
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
