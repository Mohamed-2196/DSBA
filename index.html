<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pulse.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Modules, lessons, files, the newsletter and the forum for DSBA students at BIBF." />
    <meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0F2C" media="(prefers-color-scheme: dark)" />
    <title>DSBA Pulse</title>
    <script>
      // Apply the saved theme before first paint (v1 key: localStorage.theme = 'light' | 'dark').
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
