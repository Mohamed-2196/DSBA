<text x="58" y="270" class="disp" font-size="21" font-weight="750" fill="#0A1F44" text-anchor="start" letter-spacing="-0.46" >The test</text>
<text x="58" y="298" class="ui" font-size="16" font-weight="400" fill="#0A1F44" text-anchor="start" >Compare the best fit under H₀ with the</text>
<text x="58" y="326" class="ui" font-size="16" font-weight="400" fill="#0A1F44" text-anchor="start" >best fit overall. A small ratio means H₀</text>
<text x="58" y="354" class="ui" font-size="16" font-weight="400" fill="#0A1F44" text-anchor="start" >explains the data badly.</text>
<text x="118" y="414" class="ui" font-size="19" font-weight="500" fill="#0A1F44" text-anchor="start" font-style="italic">Λ =</text>
<text x="199.45" y="402.22" class="ui" font-size="19" font-weight="500" fill="#0A1F44" text-anchor="middle" font-style="italic">L(θ<tspan font-size="12" dy="4">0</tspan><tspan dy="-4">)</tspan></text>
