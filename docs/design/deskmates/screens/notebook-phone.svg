<text x="199.45" y="428.82" class="ui" font-size="19" font-weight="500" fill="#0A1F44" text-anchor="middle" font-style="italic">max L(θ)</text>
<text x="58" y="474" class="ui" font-size="16" font-weight="600" fill="#0A1F44" text-anchor="start" >Reject H₀ when −2 log Λ &gt; 3.84</text>
