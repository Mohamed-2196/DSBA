<text x="240" y="283.55" class="ui" font-size="13" font-weight="700" fill="#5BD49A" text-anchor="start" >Accepted answer</text>
<text x="36" y="332" class="ui" font-size="15" font-weight="400" fill="#EAF0FF" text-anchor="start" >I(θ) is the information in one observation. n</text>
<text x="36" y="355" class="ui" font-size="15" font-weight="400" fill="#EAF0FF" text-anchor="start" >independent observations carry n times as</text>
<text x="36" y="378" class="ui" font-size="15" font-weight="400" fill="#EAF0FF" text-anchor="start" >much:</text>
<rect x="36" y="393" width="318" height="46" rx="12" fill="#1A2B54" />
<text x="195" y="422" class="ui" font-size="18" font-weight="500" fill="#EAF0FF" text-anchor="middle" font-style="italic">I<tspan dy="5" font-size="13">n</tspan><tspan dy="-5">(θ) = n I(θ)</tspan></text>
<text x="36" y="461" class="ui" font-size="15" font-weight="400" fill="#EAF0FF" text-anchor="start" >So for the whole sample the bound is 1 / (n</text>
<text x="36" y="484" class="ui" font-size="15" font-weight="400" fill="#EAF0FF" text-anchor="start" >I(θ)). The formula sheet gives it per</text>
<text x="36" y="507" class="ui" font-size="15" font-weight="400" fill="#EAF0FF" text-anchor="start" >observation.</text>
