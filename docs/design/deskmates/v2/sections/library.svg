<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Stacks, the library's desk-mate (idle)</title>
  <defs>
    
  </defs>
  <g stroke="#14234D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="100" cy="184" rx="60" ry="7" fill="#14234D" opacity=".12" stroke="none"/>
    <!-- loose sheets peeking out of the top -->
    <g transform="rotate(-7 82 64)"><rect x="46" y="40" width="80" height="50" rx="7" fill="#FFFFFF"/>
      <path d="M58 54h44M58 64h32" stroke="#C9D5EA" stroke-width="4"/></g>
    <g transform="rotate(8 128 60)">
      <path d="M96 36h46l14 14v40H96z" fill="#F4F7FD"/>
      <path d="M142 36v14h14" fill="#DCE6F5"/>
      <path d="M106 52h26M106 62h38" stroke="#C9D5EA" stroke-width="4"/></g>
    <!-- feet -->
    <rect x="62" y="162" width="22" height="18" rx="9" fill="#14234D"/>
    <rect x="116" y="162" width="22" height="18" rx="9" fill="#14234D"/>
    <!-- the stack: a top sheet block on three offset booklets -->
    <rect x="36" y="150" width="128" height="20" rx="7" fill="#E8A600"/>
    <rect x="44" y="134" width="124" height="20" rx="7" fill="#FFE29A"/>
    <path d="M150 138v12" stroke-width="3.5"/>
    <rect x="32" y="118" width="126" height="20" rx="7" fill="#FFC233"/>
    <path d="M44 128h20" stroke="#C98F00" stroke-width="3.5"/>
    <rect x="42" y="66" width="116" height="60" rx="16" fill="#FFFFFF"/>
    <!-- paper clip worn like a hair clip -->
    <path d="M60 58v-20a8 8 0 0 1 16 0v30a5 5 0 0 1-10 0v-24" fill="none" stroke="#8E9BB8" stroke-width="4.5"/>
    <!-- arms holding a sheet -->
    <path d="M42 100c-10 2-16 9-15 17" fill="none"/>
    <path d="M158 100c10 2 16 9 15 17" fill="none"/>
  </g>
  <!-- face -->
  <g>
    <ellipse cx="80" cy="90" rx="6" ry="7.5" fill="#14234D"/>
    <ellipse cx="120" cy="90" rx="6" ry="7.5" fill="#14234D"/>
    <circle cx="78" cy="87" r="2.2" fill="#fff"/><circle cx="118" cy="87" r="2.2" fill="#fff"/>
    <ellipse cx="66" cy="102" rx="8" ry="4.5" fill="#FF8FA3" opacity=".55"/>
    <ellipse cx="134" cy="102" rx="8" ry="4.5" fill="#FF8FA3" opacity=".55"/>
    <path d="M93 100q7 7 14 0" fill="none" stroke="#14234D" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
