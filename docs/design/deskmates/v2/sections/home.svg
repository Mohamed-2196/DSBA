    <ellipse cx="140" cy="89" rx="7.5" ry="4.3" fill="#FF9DB0" opacity=".7"/>
    <path d="M103 87q6 6 12 0" fill="none" stroke="#14234D" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
