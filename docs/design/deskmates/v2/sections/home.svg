<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Lumen, the Home desk-mate (idle)</title>
  <g stroke="#14234D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="100" cy="184" rx="58" ry="7" fill="#14234D" opacity=".12" stroke="none"/>
    <!-- light falling on the desk -->
    <path d="M74 116h72l18 52H56z" fill="#FFE29A" opacity=".45" stroke="none"/>
    <!-- arm, behind the shade -->
    <path d="M100 166L44 128L90 76" fill="none" stroke="#14234D" stroke-width="13"/>
    <path d="M100 166L44 128L90 76" fill="none" stroke="#9AA8C4" stroke-width="5"/>
    <circle cx="44" cy="128" r="9" fill="#DCE3F0"/>
    <!-- base -->
    <rect x="66" y="160" width="68" height="20" rx="10" fill="#1F3A93"/>
    <circle cx="100" cy="166" r="6" fill="#DCE3F0"/>
    <!-- shade: the face -->
