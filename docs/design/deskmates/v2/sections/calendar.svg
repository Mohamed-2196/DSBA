<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Blink, the calendar desk-mate (idle)</title>
  <defs><clipPath id="cal-page"><rect x="40" y="40" width="120" height="128" rx="18"/></clipPath></defs>
  <g stroke="#14234D" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="100" cy="184" rx="58" ry="7" fill="#14234D" opacity=".12" stroke="none"/>
    <!-- feet -->
    <rect x="66" y="162" width="22" height="18" rx="9" fill="#14234D"/>
    <rect x="112" y="162" width="22" height="18" rx="9" fill="#14234D"/>
    <!-- the page underneath, peeking at the corner -->
    <rect x="46" y="46" width="120" height="126" rx="18" fill="#DCE6F5"/>
    <!-- page -->
    <rect x="40" y="40" width="120" height="128" rx="18" fill="#FFFFFF"/>
    <g clip-path="url(#cal-page)" stroke="none">
      <rect x="30" y="30" width="140" height="44" fill="#F0524B"/>
      <!-- the date dots on the header: today is marked -->
      <circle cx="62" cy="58" r="4" fill="#FFC9C4"/><circle cx="78" cy="58" r="4" fill="#FFC9C4"/>
      <circle cx="94" cy="58" r="4" fill="#FFC9C4"/><circle cx="110" cy="58" r="6" fill="#FFFFFF"/>
      <circle cx="126" cy="58" r="4" fill="#FFC9C4"/><circle cx="142" cy="58" r="4" fill="#FFC9C4"/>
    </g>
    <path d="M42 74h116"/>
    <rect x="40" y="40" width="120" height="128" rx="18" fill="none"/>
    <!-- curled corner -->
    <path d="M160 140v10a18 18 0 0 1-18 18h-12q14-4 18-16 4-10 12-12z" fill="#DCE6F5"/>
    <!-- rings, worn like ears -->
    <rect x="62" y="26" width="12" height="28" rx="6" fill="#DCE3F0"/>
    <rect x="126" y="26" width="12" height="28" rx="6" fill="#DCE3F0"/>
  </g>
  <g>
    <ellipse cx="82" cy="110" rx="7" ry="8.5" fill="#14234D"/>
    <ellipse cx="118" cy="110" rx="7" ry="8.5" fill="#14234D"/>
    <circle cx="80" cy="106.5" r="2.5" fill="#fff"/><circle cx="116" cy="106.5" r="2.5" fill="#fff"/>
    <ellipse cx="68" cy="124" rx="7.5" ry="4.3" fill="#FF8FA3" opacity=".55"/>
    <ellipse cx="132" cy="124" rx="7.5" ry="4.3" fill="#FF8FA3" opacity=".55"/>
    <path d="M94 124q6 6 12 0" fill="none" stroke="#14234D" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
