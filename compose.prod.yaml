# Production: Caddy (TLS, the web app, the API under /api), the API, PostgreSQL, the mail and text workers, and two
# daily jobs (backup, sweep).
# Object storage is outside: AWS S3, or MinIO behind HTTPS. Settings come from .env next to this file (see
# .env.example); compose stops here when a required one is missing, and the API refuses to start while any
# setting is unsafe for production. docs/backend/DEPLOYMENT.md walks through it.
#
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml run --rm api python -m app.cli setup-bucket     # once
#   docker compose -f compose.prod.yaml run --rm api python -m app.cli seed             # once, and after updates
name: dsba-hub

x-bucket-env: &bucket-env
  DSBA_S3_ENDPOINT_URL: ${DSBA_S3_ENDPOINT_URL?set DSBA_S3_ENDPOINT_URL in .env (empty for AWS S3)}
  DSBA_S3_PUBLIC_ENDPOINT_URL: ${DSBA_S3_PUBLIC_ENDPOINT_URL:-}
  DSBA_S3_REGION: ${DSBA_S3_REGION:?set DSBA_S3_REGION in .env}
  DSBA_S3_BUCKET: ${DSBA_S3_BUCKET:?set DSBA_S3_BUCKET in .env}
  DSBA_S3_FORCE_PATH_STYLE: ${DSBA_S3_FORCE_PATH_STYLE:-false}

x-api-env: &api-env
  <<: *bucket-env
  DSBA_ENV: production
  DSBA_SECRET_KEY: ${DSBA_SECRET_KEY:?set DSBA_SECRET_KEY in .env}
  DSBA_DATABASE_URL: postgresql+psycopg://dsba:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dsba
  DSBA_WEB_ORIGINS: https://${DSBA_DOMAIN:?set DSBA_DOMAIN in .env}
  DSBA_WEB_BASE_URL: https://${DSBA_DOMAIN}
  # Only the proxy (the web service, at its fixed address below) may tell the API who the client is.
  DSBA_TRUSTED_PROXIES: ${DSBA_PROXY_IP:-172.30.0.10}
  DSBA_S3_ACCESS_KEY_ID: ${DSBA_S3_ACCESS_KEY_ID:?set DSBA_S3_ACCESS_KEY_ID in .env}
  DSBA_S3_SECRET_ACCESS_KEY: ${DSBA_S3_SECRET_ACCESS_KEY:?set DSBA_S3_SECRET_ACCESS_KEY in .env}
  DSBA_EMAIL_BACKEND: smtp
  DSBA_EMAIL_FROM: ${DSBA_EMAIL_FROM:?set DSBA_EMAIL_FROM in .env}
  DSBA_SMTP_HOST: ${DSBA_SMTP_HOST:?set DSBA_SMTP_HOST in .env}
  DSBA_SMTP_PORT: ${DSBA_SMTP_PORT:-587}
  DSBA_SMTP_USERNAME: ${DSBA_SMTP_USERNAME:-}
  DSBA_SMTP_PASSWORD: ${DSBA_SMTP_PASSWORD:-}
  DSBA_SMTP_STARTTLS: ${DSBA_SMTP_STARTTLS:-true}
  DSBA_ADMIN_IDENTIFIERS: ${DSBA_ADMIN_IDENTIFIERS:-}
  # "Continue with Google" (DEPLOYMENT.md, section 13): off while either is empty.
  DSBA_GOOGLE_CLIENT_ID: ${DSBA_GOOGLE_CLIENT_ID:-}
  DSBA_GOOGLE_CLIENT_SECRET: ${DSBA_GOOGLE_CLIENT_SECRET:-}
  DSBA_PORTAL_HOSTS: ${DSBA_PORTAL_HOSTS:-bibf.edu.bh,bibf.com,london.ac.uk}  # Site settings' links (SEC-64)
  DSBA_ANTHROPIC_API_KEY: ${DSBA_ANTHROPIC_API_KEY:-}  # Mini Noora's AI answers (the noora.ai feature)
  DSBA_NOORA_MODEL: ${DSBA_NOORA_MODEL:-claude-haiku-5-5}

# Docker's logs rotate (10 MB, 5 files a service), so they never fill the disk the database lives on.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api: &api
  build: ./api
  image: dsba-hub-api
  environment: *api-env
  networks: [internal]
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:17-alpine
    logging: *logging
    environment:
      POSTGRES_USER: dsba
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dsba
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsba -d dsba"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    # The migrations, then the text worker's database role: created, or given its password again, with only what it
    # needs on the tables as they now are (`python -m app.cli texts-role`).
    <<: *api
    command: sh -c "alembic upgrade head && python -m app.cli texts-role"
    environment:
      <<: *api-env
      DSBA_TEXTS_DB_PASSWORD: ${DSBA_TEXTS_DB_PASSWORD:?set DSBA_TEXTS_DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    # No published port: only the web service reaches it. A memory spike restarts the API, not the whole server.
    <<: *api
    mem_limit: ${DSBA_API_MEMORY:-1g}
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      args:
        VITE_CSRF_COOKIE: __Host-dsba_csrf
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    environment:
      DSBA_DOMAIN: ${DSBA_DOMAIN}
      DSBA_BUCKET_ORIGIN: ${DSBA_BUCKET_ORIGIN:?set DSBA_BUCKET_ORIGIN in .env (the origin of presigned URLs)}
      DSBA_API_UPSTREAM: api:8000
      DSBA_CSP_SCRIPT_EXTRA: ${DSBA_CSP_SCRIPT_EXTRA:-}
      DSBA_CSP_CONNECT_EXTRA: ${DSBA_CSP_CONNECT_EXTRA:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - caddy_data:/data  # certificates: keep this volume
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: ${DSBA_PROXY_IP:-172.30.0.10}
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

  backup:
    # Every 24 hours: pg_dump into the backup bucket, encrypted at rest, newest DSBA_BACKUP_KEEP kept. It holds only
    # the database and its own bucket key (the API never holds it): no secret key, mail, texts or AI keys. A failed
    # run says BACKUP FAILED in the log, pings DSBA_BACKUP_PING_URL/fail, and is tried again an hour later; set the
    # ping URL so a failure, or a job that stops running, reaches you. Restore: docs/backend/DEPLOYMENT.md.
    <<: *api
    command: >-
      sh -c "while true; do if python -m app.cli backup; then sleep 86400; else sleep 3600; fi; done"
    environment:
      <<: *bucket-env
      DSBA_ENV: production
      DSBA_ROLE: backup
      DSBA_DATABASE_URL: postgresql+psycopg://dsba:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dsba
      DSBA_BACKUP_BUCKET: ${DSBA_BACKUP_BUCKET:?set DSBA_BACKUP_BUCKET in .env}
      DSBA_BACKUP_PREFIX: ${DSBA_BACKUP_PREFIX:-backups/db/}
      DSBA_BACKUP_S3_ENDPOINT_URL: ${DSBA_BACKUP_S3_ENDPOINT_URL:-}
      DSBA_BACKUP_S3_REGION: ${DSBA_BACKUP_S3_REGION:-}
      DSBA_BACKUP_ACCESS_KEY_ID: ${DSBA_BACKUP_ACCESS_KEY_ID:?set DSBA_BACKUP_ACCESS_KEY_ID in .env}
      DSBA_BACKUP_SECRET_ACCESS_KEY: ${DSBA_BACKUP_SECRET_ACCESS_KEY:?set DSBA_BACKUP_SECRET_ACCESS_KEY in .env}
      DSBA_BACKUP_SSE: ${DSBA_BACKUP_SSE:-AES256}
      DSBA_BACKUP_KMS_KEY_ID: ${DSBA_BACKUP_KMS_KEY_ID:-}
      DSBA_BACKUP_KEEP: ${DSBA_BACKUP_KEEP:-14}
      DSBA_BACKUP_PING_URL: ${DSBA_BACKUP_PING_URL:-}
    healthcheck:
      disable: true  # no web server in this container
    depends_on:
      migrate:
        condition: service_completed_successfully

  sweep:
    # Every 24 hours: uploads never attached to anything, old sign-in codes, sessions that ended long ago, the files
    # of library items rejected or removed a week ago, and the screenshots of bug reports closed 90 days ago. It
    # holds only the database and the bucket. A failed run says SWEEP FAILED, pings DSBA_SWEEP_PING_URL/fail and is
    # tried again an hour later.
    <<: *api
    command: >-
      sh -c "while true; do if python -m app.cli sweep; then sleep 86400; else sleep 3600; fi; done"
    environment:
      <<: *bucket-env
      DSBA_ENV: production
      DSBA_ROLE: sweep
      DSBA_DATABASE_URL: postgresql+psycopg://dsba:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dsba
      DSBA_S3_ACCESS_KEY_ID: ${DSBA_S3_ACCESS_KEY_ID:?set DSBA_S3_ACCESS_KEY_ID in .env}
      DSBA_S3_SECRET_ACCESS_KEY: ${DSBA_S3_SECRET_ACCESS_KEY:?set DSBA_S3_SECRET_ACCESS_KEY in .env}
      DSBA_SWEEP_PING_URL: ${DSBA_SWEEP_PING_URL:-}
    healthcheck:
      disable: true  # no web server in this container
    depends_on:
      migrate:
        condition: service_completed_successfully

  mail:
    # The mail worker: sends the queued emails (notifications, account notices) and retries failures with backoff.
    # Several may run (each email is claimed with FOR UPDATE SKIP LOCKED); `docker compose stop` lets it finish the
    # email in hand.
    <<: *api
    command: python -m app.cli mail-worker
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  texts:
    # The text worker: reads the words of each published PDF and Word file once, for search inside papers, and makes
    # its cover. Each file is read in a child process with a time and memory limit that can't see the worker's
    # settings, in its environment or through /proc. The worker itself gets only what it needs: its own database
    # role (dsba_texts, reaching two tables; the migrate service sets it up) and a bucket key that can only read
    # library/ and write covers/ (docs/backend/DEPLOYMENT.md, section 3). No secret key, mail, texts or AI keys.
    <<: *api
    command: python -m app.cli text-worker
    mem_limit: ${DSBA_TEXTS_MEMORY:-1g}
    environment:
      <<: *bucket-env
      DSBA_ENV: production
      DSBA_DATABASE_URL: postgresql+psycopg://dsba_texts:${DSBA_TEXTS_DB_PASSWORD:?set DSBA_TEXTS_DB_PASSWORD in .env}@db:5432/dsba
      DSBA_S3_ACCESS_KEY_ID: ${DSBA_TEXTS_S3_ACCESS_KEY_ID:?set DSBA_TEXTS_S3_ACCESS_KEY_ID in .env}
      DSBA_S3_SECRET_ACCESS_KEY: ${DSBA_TEXTS_S3_SECRET_ACCESS_KEY:?set DSBA_TEXTS_S3_SECRET_ACCESS_KEY in .env}
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  internal:
    ipam:
      config:
        - subnet: ${DSBA_DOCKER_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
