# The end-to-end suite's settings for the local stack, on top of compose.yaml. scripts/e2e.sh applies it, runs the
# suite and says how to undo it; on its own:
#
#   docker compose -f compose.yaml -f compose.e2e.yaml up -d --no-deps api mail web    # e2e mode
#   docker compose up -d --no-deps api mail web    # back to Mailpit (from the main checkout: scripts/e2e.sh --restore)
#
# What changes while it is applied (development only; production uses compose.prod.yaml):
#   - Emails (the mail worker's notifications and account notices) are saved as .eml files in api/var/mail instead of
#     going to Mailpit, where the suite reads them. api/var/ is git-ignored.
#   - Every request reaches the API through the web container's proxy, so the whole suite comes from one address.
#     A run signs up three students and signs in again several times, and an afternoon of reruns would pass the
#     per-network limits on sign-ups (10 an hour, 30 a day) and sign-ins (60 an hour), so those are raised. The
#     limits on wrong passwords for an address stay as they are: each run signs up new students.
#   - "Continue with Google" stays off (no DSBA_GOOGLE_CLIENT_ID): the suite can't sign in to Google.

x-e2e-mail: &e2e-mail
  DSBA_EMAIL_BACKEND: file
  DSBA_EMAIL_FILE_DIR: /app/var/mail

services:
  api:
    environment:
      <<: *e2e-mail
      DSBA_SIGN_UPS_PER_NETWORK_PER_HOUR: "1000"
      DSBA_SIGN_UPS_PER_NETWORK_PER_DAY: "10000"
      DSBA_SIGN_INS_PER_NETWORK_PER_HOUR: "1000"
      DSBA_GOOGLE_CLIENT_ID: ""
      DSBA_GOOGLE_CLIENT_SECRET: ""
    volumes:
      - ./api/var/mail:/app/var/mail

  mail:
    environment:
      <<: *e2e-mail
    volumes:
      - ./api/var/mail:/app/var/mail
