# Railway deploys every push to feature/backend to the dev environment: the API and the web app, each from its
# Dockerfile, with the pushed commit in RAILWAY_GIT_COMMIT_SHA. This waits (up to ten minutes) until both run the
# pushed commit, then checks the API's health and the web app's bundle (scripts/check-deploy.sh), and fails when the
# commit isn't live or isn't healthy. It only reads the deployed site; it never talks to Railway.
name: Railway dev deploy

on:
  push:
    branches: [feature/backend]
  workflow_dispatch:

# The job's token gets no permissions (security review SEC-43): it reads the public repository and the site only.
permissions: {}

# A newer push replaces both the deploy and this check of the older one.
concurrency:
  group: railway-dev
  cancel-in-progress: true

jobs:
  live:
    name: The pushed commit is live on dev
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEPLOY_URL: https://web-dev-254f.up.railway.app
      DEPLOY_TIMEOUT: "600"
      DEPLOY_POLL: "15"
    steps:
      # The script at the pushed commit, read without a token (the repository is public; no checkout needed).
      - name: Get the check
        run: >-
          curl -fsSL --retry 3 -o check-deploy.sh
          "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/check-deploy.sh"

      - name: Wait for the deploy, then check its health and bundle
        run: bash check-deploy.sh "$DEPLOY_URL" "$GITHUB_SHA"
