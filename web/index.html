<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="DSBA Hub" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Modules, lessons, files, the newsletter and the forum for DSBA students at BIBF." />
    <meta name="theme-color" content="#F4F7FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07122B" media="(prefers-color-scheme: dark)" />
    <title>DSBA Hub</title>
    <style>
      /* Before the app's code arrives (a slow first load): the frame of the Hub and the shape of a page, in the
         theme's colours, so the screen is never blank. React replaces it on its first render (UX-77). */
      .boot { --b-paper: #f4f7fc; --b-surface: #ffffff; --b-shade: #e3eaf5; --b-line: #dce5f2; }
      [data-theme='dark'] .boot { --b-paper: #07122b; --b-surface: #0d1b3b; --b-shade: #182c58; --b-line: #213563; }
      html, body { margin: 0; }
      .boot { min-height: 100vh; background: var(--b-paper); }
      .boot__top { height: 64px; border-bottom: 1px solid var(--b-line); background: var(--b-surface); }
      .boot__page { max-width: 1180px; margin: 0 auto; padding: 32px 40px; }
      .boot__bar { height: 14px; margin-bottom: 12px; border-radius: 6px; background: var(--b-shade); }
      .boot__title { width: min(320px, 70%); height: 32px; border-radius: 8px; }
      .boot__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 24px; }
      .boot__card { height: 200px; border-radius: 16px; background: var(--b-surface); border: 1px solid var(--b-line); }
      .boot__tabs { display: none; }
      @media (min-width: 700px) {
        .boot { padding-left: 72px; }
      }
      @media (min-width: 1100px) {
        .boot { padding-left: 264px; }
      }
      @media (max-width: 699px) {
        .boot__page { padding: 20px 16px; }
        .boot__tabs { display: block; position: fixed; left: 0; right: 0; bottom: 0; height: 64px; border-top: 1px solid var(--b-line); background: var(--b-surface); }
      }
    </style>
    <script>
      // Apply the saved theme before first paint (localStorage.theme = 'light' | 'dark', as ThemeProvider writes it).
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true">
        <div class="boot__top"></div>
        <div class="boot__page">
          <div class="boot__bar boot__title"></div>
          <div class="boot__bar" style="width: min(520px, 90%)"></div>
          <div class="boot__grid"><div class="boot__card"></div><div class="boot__card"></div><div class="boot__card"></div></div>
        </div>
        <div class="boot__tabs"></div>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Loading DSBA Hub</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
